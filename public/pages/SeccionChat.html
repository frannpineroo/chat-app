<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
}

.chats {
    width: 280px;
    background: #fff;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    height: 100vh;
}

.busqueda {
    padding: 10px;
}

.busqueda input {
    flex: 1;
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: border 0.2s ease;
}

.busqueda input:focus {
    outline: none;
    border: 1px solid #4f6df5;
}

.busqueda form {
    display: flex;
    gap: 8px; 
}

.busqueda button {
    background: #4f6df5; 
    color: white;
    border: none;
    padding: 8px 16px;    
    border-radius: 8px;        
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
}

.busqueda button:hover { /* efecto al pasar el puntero */
    background: #3b53c7; 
    transform: translateY(-1px);
}

.busqueda button:active {
    transform: translateY(0);
}

.seccionChat {
    padding: 10px;
}

.seccionChat h5 {
    color: #888;
    font-size: 12px;
    margin: 10px 0;
}

.chat-item {
    display: flex;
    align-items: center;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.chat-item.active,
.chat-item:hover {
    background: #e8e8ff;
}

.avatar {
    background: #a0a0ff;
    color: #fff;
    border-radius: 50%;
    width: 35px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    margin-right: 10px;
}

.chat-info {
    flex-grow: 1;
}

.nombre {
    font-weight: bold;
    margin: 0;
}

.preview {
    font-size: 12px;
    color: #666;
    margin: 0;
}
</style>
</head>

<body>

<div class="chats">

    <div class="busqueda">
        <form id="searchForm">
            <input id="texto" placeholder="Buscar por nombre..." />
            <button type="submit">Buscar</button>
        </form>

        <div id="Resultados" class="chat-resultados"></div>
    </div>

    <div class="seccionChat">
        <h5>CHATS PRIVADOS</h5>
        <div id="privateChats"></div>
    </div>

    <div class="seccionChat">
        <h5>CHATS GRUPALES</h5>
        <div id="groupChats"></div>
    </div>

</div>

<script>

let selectedChatId = 0;
let usuarioId = 1;

let chats = [];
let listaChats = [];
let searchText = "";

document.addEventListener("DOMContentLoaded", () => {
    cargarChats();
    document.getElementById("searchForm").addEventListener("submit", buscarChats);
});

async function cargarChats() {
    try {
        const response = await fetch(`/api/chat/usuarios/${usuarioId}/chats`);
        const resultado = await response.json();

            chats = Array.isArray(resultado) ? resultado : [];
            renderChats();

    } catch (e) {
        console.error("ERROR:", e);
        chats = [];
    }
}

// FILTROS

function buscarChats(chat) {
    if (!searchText) return true;

    return chat.nombreChat.toLowerCase().includes(searchText.toLowerCase())
        || chat.id.toString().includes(searchText);
}

function buscarChatsPrivados() {
    return chats.filter(c => !c.isGroup );
}

function buscarChatsGrupales() {
    return chats.filter(c => c.isGroup );
}

//RENDERIZADO

function renderChats() {
    renderChatsPrivados();
    renderChatsGrupales();
}

function renderChatsPrivados() {
    const container = document.getElementById("privateChats");
    container.innerHTML = "";

    buscarChatsPrivados().forEach(chat => {
        container.appendChild(crearItem(chat));
    });
}

function renderChatsGrupales() {
    const container = document.getElementById("groupChats");
    container.innerHTML = "";

    buscarChatsGrupales().forEach(chat => {
        container.appendChild(crearItem(chat));
    });
}

function crearItem(chat) {
    let previewText = "";

     if (chat.mensajes && chat.mensajes.length > 0) {
       previewText = chat.mensajes;
    }

    const div = document.createElement("div");
    div.className = "chat-item" + (chat.id === selectedChatId ? " active" : "");
    div.onclick = () => enterChat(chat.id);

    div.innerHTML = `
        <span class="avatar">${getInitials(chat.nombreChat)}</span>
        <div class="chat-info">
            <p class="nombre">${chat.nombreChat}</p>
            <p class="preview">${previewText}</p>
        </div>
    `;

    return div;
}

// EVENTOS

function enterChat(chatId) {
    selectedChatId = chatId;
    renderChats();

    // Aquí simula OnChatSelected.InvokeAsync
    console.log("Chat seleccionado:", chatId);
}

async function buscarChats(e) {
    e.preventDefault();

    const filtro = document.getElementById("texto").value;

    try {
        const response = await fetch(`/api/chat/usuarios/${usuarioId}/filtro/${filtro}`);
        const resultado = await response.json();

            listaChats = resultado;
            mostrarResultados();

    } catch (e) {
        console.error("ERROR:", e.message);
    }
}

function mostrarResultados() {
    const container = document.getElementById("Resultados");
    container.innerHTML = "";

    listaChats.forEach(chat => {
        const div = crearItem(chat);
        container.appendChild(div);
    });
}

// UTILIDADES

function getInitials(nombreChat) {
    if (!nombreChat) return "?";

    const parts = nombreChat.trim().split(" ");
    if (parts.length === 1) return parts[0][0].toUpperCase();

    return (parts[0][0] + parts[1][0]).toUpperCase();

}

</script>

</body>

</html>
