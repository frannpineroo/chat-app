<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Demo Chat</title>
<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    height:100vh;
}

/* ===== Página principal ===== */
#mainPage{
    display:flex;
    width:100%;
}

#chatList{
    width:25%;
    background:#f4f4f4;
    border-right:1px solid #ccc;
    padding:10px;
    box-sizing:border-box;
}

.chatItem{
    padding:10px;
    background:white;
    margin-bottom:8px;
    cursor:pointer;
    border-radius:5px;
}

.chatItem.active{
    background:#d0e6ff;
}

#chatWindow{
    flex:1;
    padding:20px;
}

/* ===== Botón flotante ===== */
#chatIcon{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#007bff;
    color:white;
    font-size:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#menu{
    position:fixed;
    bottom:90px;
    right:20px;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    display:none;
    flex-direction:column;
    width:220px;
}

.menuItem{
    padding:12px;
    cursor:pointer;
    border-bottom:1px solid #eee;
}

.menuItem:hover{
    background:#f0f0f0;
}

/* ===== Pantallas emergentes ===== */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal{
    background:white;
    padding:20px;
    width:400px;
    border-radius:8px;
    max-height:90vh;
    overflow:auto;
}

input[type="text"]{
    width:100%;
    padding:8px;
    margin:5px 0 10px 0;
    box-sizing:border-box;
}

.userResult{
    padding:6px;
    background:#f1f1f1;
    margin:5px 0;
    cursor:pointer;
    border-radius:4px;
}

.userResult.active {
    background-color: #d0e6ff;
    border-left: 4px solid #2196F3;
}

.selectedUser{
    background:#cce5ff;
    padding:5px;
    margin:5px 5px 0 0;
    display:inline-block;
    border-radius:4px;
}

button{
    padding:8px 12px;
    margin:10px 5px 0 0;
    cursor:pointer;
}
</style>
</head>
<body>

<!-- Página principal -->
<div id="mainPage">
    <div id="chatList">
        <h3>Chats</h3>
        <div id="chats"></div>
    </div>
    <div id="chatWindow">
        <h2>Selecciona un chat</h2>
        <div id="chatContent"></div>
    </div>
</div>

<!-- Icono flotante -->
<div id="chatIcon">+</div>

<!-- Menú desplegable -->
<div id="menu">
    <div class="menuItem" onclick="nuevoChat()">Nuevo chat</div>
    <div class="menuItem" onclick="nuevoGrupo()">Nuevo grupo</div>
</div>

<!-- Modal Chat Individual -->
<div class="overlay" id="individualModal">
    <div class="modal">
        <h3>Buscar usuario</h3>
        <input type="text" id="buscarNombre" placeholder="Nombre de usuario">
        <button onclick="buscarUsuarios()">Buscar</button>
        <div id="Resultados"></div>
        <button onclick="cerrarCuadro()">Cancelar</button>
        <button onclick="crearChat()">Enviar mensaje</button>
    </div>
</div>

<!-- Modal Chat Grupal -->
<div class="overlay" id="groupModal">
    <div class="modal">
        <h3>Crear Grupo</h3>

        <label>Nombre del grupo</label>
        <input type="text" id="nombreGrupo">

        <label>
            <input type="checkbox" id="isModerated">
            Grupo moderado
        </label>

        <h4>Buscar usuarios</h4>
        <input type="text" id="buscarUsuarios">
        <button onclick="buscarUsuariosGrupo()">Buscar</button>

        <div id="usuariosEncontrados"></div>

        <h4>Usuarios seleccionados</h4>
        <div id="usuariosElegidos"></div>

        <button onclick="cerrarCuadro()">Cancelar</button>
        <button onclick="createGroupChat()">Crear chat</button>
    </div>
</div>

<script>

const dummyUsers = ["Ana","Luis","Carlos","María","Pedro","Lucía","Sofía","Miguel"];

document.getElementById("chatIcon").onclick = () => {
    const menu = document.getElementById("menu");
    menu.style.display = menu.style.display === "flex" ? "none" : "flex";
};

function nuevoChat(){
    document.getElementById("menu").style.display="none";
    document.getElementById("individualModal").style.display="flex";
}

function nuevoGrupo(){
    document.getElementById("menu").style.display="none";
    document.getElementById("groupModal").style.display="flex";
}

function cerrarCuadro(){
    document.getElementById("individualModal").style.display="none";
    document.getElementById("groupModal").style.display="none";
    selectedUsers=[];
    document.getElementById("usuariosElegidos").innerHTML="";
}

//METODOS PARA CHAT INDIVIDUAL
let chats = [];
let selectedUsers = [];
let usuarioSeleccionado = null;

async function buscarUsuarios(){
    const nombre = document.getElementById("buscarNombre").value;

    try {
        const response = await fetch(`/api/usuarios/${encodeURIComponent(nombre)}`);
        const usuarios = await response.json();
        
        mostrarResultadosBusqueda(usuarios);

    } catch (e) {
        console.error("ERROR:", e.message);
    }
}

function mostrarResultadosBusqueda(usuarios){
    const container = document.getElementById("Resultados");
    container.innerHTML = "";

    if(usuarios.length === 0){
        container.innerHTML = "<p>No se encontraron usuarios</p>";
        return;
    }

    usuarios.forEach(usuario => {
        const div = document.createElement("div");
        div.className = "userResult";
        div.textContent = usuario.nombre + " " + usuario.apellido;

        div.onclick = () => {
            usuarioSeleccionado = usuario;
            document.querySelectorAll(".userResult").forEach(el => el.classList.remove("active"));
            div.classList.add("active");
            //console.log("Usuario seleccionado:", usuarioSeleccionado);
        };
        container.appendChild(div);
    });
}

function addChat(usuarios){
    usuarios.forEach(usuario => {
        chats.push(usuario);
    });
    renderChats();
    openChat(usuarios[0]);
}

function openChat(usuario){
    document.querySelectorAll(".chatItem").forEach(item=>{
        item.classList.remove("active");
        if(item.textContent===usuario.nombre + " " + usuario.apellido){
            item.classList.add("active");
        }
    });
    document.getElementById("chatWindow").innerHTML=
        "<h2>"+usuario.nombre + " " + usuario.apellido+"</h2><p>Escribe tu primer mensaje...</p>";
}
//HASTAAQUI

async function crearChat(e){ //REVISAR ESTE METODO CUANDO SE ADAPTE A LA PAGINA PRINCIPAL
    e.preventDefault();
    //const nombre = document.getElementById("individualSearch").value;

    try {
    if(!usuarioSeleccionado){
        alert("Selecciona un usuario primero");
        return;
    }
    const existe = chats.find(u => u.id === usuarioSeleccionado.id);

    if(existe){
        openChat(existe);
        cerrarCuadro();
        return;
    
        const response = await fetch(`/api/chats`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ usuarioId: usuarioSeleccionado.id })
        });
        if(!response.ok){
            throw new Error("Error al crear el chat");
        }
        const nuevoChat = await response.json();

        chats.push(nuevoChat);
        renderChats();
        openChat(nuevoChat);
        cerrarCuadro();

        usuarioSeleccionado = null;
        }
    } catch (e) {
        console.error("ERROR:", e.message);
    }
}

//CREAR CHAT GRUPAL
async function buscarUsuariosGrupo(){

    const nombre = document.getElementById("buscarUsuarios").value;
    if(!nombre){
        mostrarResultadosBusquedaGrupo([]);
        return;
    }
    try {
        const response = await fetch(`/api/usuarios/${encodeURIComponent(nombre)}`);
        const usuarios = await response.json();
        if(!Array.isArray(usuarios)){
            console.error("La respuesta no es un array:", usuarios);
            mostrarResultadosBusquedaGrupo([]);
            return;
        }
        mostrarResultadosBusquedaGrupo(usuarios);

    } catch (e) {
        console.error("ERROR:", e.message);
    }
}

function mostrarResultadosBusquedaGrupo(usuarios){

    const container = document.getElementById("usuariosEncontrados");
    container.innerHTML = "";

    if(usuarios.length === 0){
        container.innerHTML = "<p>No se encontraron usuarios</p>";
        return;
    }

    usuarios.forEach(usuario => {

        const div = document.createElement("div");
        div.className = "userResult";
        div.textContent = usuario.nombre + " " + usuario.apellido;

        div.addEventListener("click", function(){

            const id = Number(usuario.id);

            if(!selectedUsers.includes(id)){
                selectedUsers.push(id);
                this.classList.add("active");
            } else {
                selectedUsers = selectedUsers.filter(u => u !== id);
                this.classList.remove("active");
            }

            console.log("Usuarios seleccionados:", selectedUsers);
        });

        container.appendChild(div);
    });
}

let nombreGrupo = "";
let isModerated = false;
async function createGroupChat(){  //REVISAR ESTE METODO CUANDO SE ADAPTE A LA PAGINA PRINCIPAL

    nombreGrupo = document.getElementById("nombreGrupo").value;
    isModerated = document.getElementById("isModerated").checked;

    if(!nombreGrupo){
        alert("Ingresa un nombre para el grupo");
        return;
    }

    if(selectedUsers.length < 2){
        alert("Selecciona al menos 2 usuarios");
        return;
    }

    const datos = {
        nombre: nombreGrupo,
        isModerated: isModerated,
        usuarios: selectedUsers.map(u => u.id)
    };

    console.log("Datos para enviar al backend:", datos);

    try {

        const response = await fetch(`/api/chat/grupo`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        });

        if(!response.ok){
            throw new Error("Error al crear el grupo");
        }

        const nuevoGrupo = await response.json();

        chats.push(nuevoGrupo);
        renderChats();
        openChat(nuevoGrupo);

        cerrarCuadro();

        // Reset
        selectedUsers = [];
        nombreGrupo = "";
        isModerated = false;

    } catch (e) {
        console.error("ERROR:", e);
    }
}

//Hasta aqui

function searchUsers(){
    const query = document.getElementById("buscarUsuarios").value.toLowerCase();
    const resultsDiv = document.getElementById("usuariosEncontrados");
    resultsDiv.innerHTML="";
    dummyUsers
        .filter(u=>u.toLowerCase().includes(query))
        .forEach(user=>{
            const div=document.createElement("div");
            div.className="userResult";
            div.textContent=user;
            div.onclick=()=>selectUser(user);
            resultsDiv.appendChild(div);
        });
}

function selectUser(user){
    if(!selectedUsers.includes(user)){
        selectedUsers.push(user);
        const span=document.createElement("span");
        span.className="selectedUser";
        span.textContent=user;
        document.getElementById("usuariosElegidos").appendChild(span);
    }
}

function createGroupChat(){
    const name=document.getElementById("nombreGrupo").value;
    if(name){
        addChat(name + " (Grupo)");
        cerrarCuadro();
    }
}



function renderChats(){
    const container=document.getElementById("chats");
    container.innerHTML="";
    
    chats.forEach(usuario=>{
        const div=document.createElement("div");
        div.className="chatItem";
        div.textContent=usuario.nombre;

        div.onclick=()=>openChat(usuario);
        container.appendChild(div);
    });
}

}

</script>

</body>
</html>
