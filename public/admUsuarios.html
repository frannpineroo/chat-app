<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración de Usuarios</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<style>
    body {
        background-color: #111827;
        font-family: 'Segoe UI', sans-serif;
        color: #e5e7eb;
    }
    .table-dark {
        --bs-table-bg: #1f2937;
        --bs-table-hover-bg: #374151;
        color: #e5e7eb;
    }
    .form-control::placeholder {
        color: #9ca3af;
    }
    .btn-outline-light:hover {
        background-color: #2563eb;
        border-color: #2563eb;
    }
    .badge.bg-success {
        background-color: #16a34a;
    }
    .badge.bg-secondary {
        background-color: #6b7280;
    }
</style>
</head>
<body>

<div class="container-fluid py-4 text-light bg-dark">

    <!-- Título y botones superiores -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Administración de Usuarios</h2>
        <div>
            <button class="btn btn-secondary me-2" onclick="volverPrincipal()"><i class="bi bi-download"></i> Volver</button>
            <button class="btn btn-primary" onclick="registrarUsuario()"><i class="bi bi-plus"></i> Registrar Usuario</button>
        </div>
    </div>

    <!-- Filtros -->
    <div class="btn-group mb-3">
        <button class="btn btn-primary" onclick="verUsuarios()">Todos</button>
        <button class="btn btn-success" onclick="filtrarUsuarios('activo')">Activos</button>
        <button class="btn btn-danger" onclick="filtrarUsuarios('inactivo')">Inactivos</button>
    </div>

    <!-- Buscador -->
    <form id="formBuscar" class="mb-3 d-flex" onsubmit="buscarUsuarios(event)">
        <input id="inputBuscar" class="form-control bg-secondary text-white me-2" placeholder="Buscar usuarios...">
        <button type="submit" class="btn btn-primary">Buscar</button>
    </form>

    <!-- Tabla de usuarios -->
    <table class="table table-dark table-hover align-middle">
        <thead>
            <tr class="text-center">
                <th>Usuario</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tbodyUsuarios" class="text-center">
            <!-- Usuarios se llenarán con JS -->
        </tbody>
    </table>

</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admUsuarios.js"></script>
</body>
</html>
