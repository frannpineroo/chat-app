<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Iniciar Sesión</title>
</head>

<body class="min-h-screen bg-base-200 flex items-center justify-center">

    <div class="card w-96 bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-2xl justify-center">Chat App</h1>
            <p class="text-center text-sm text-gray-500" id="status" >Iniciar Sesión</p>

            <form action="" id="formLogin" class="space-y-4 mt-4">
                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" id="email" placeholder="correo@email.com" class="input input-bordered w-full" required>
                </div>

                <div class="form-control">
                    <label class="label">
                        <span class="label-text">Contraseña</span>
                    </label>
                    <input type="password" id="contra" placeholder="********" class="input input-bordered w-full" required>
                </div>
                
                <button type="submit" class="btn btn-primary w-full">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>
    <script>
        const formLogin = document.getElementById('formLogin');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const contra = document.getElementById('contra').value;

            try {
                const respuesta = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, contra })
                });

                const data = await respuesta.json();

                if ( !respuesta.ok ) {
                    throw new Error(data.message || 'Error al iniciar sesión');
                }

                alert('Inicio de sesión exitoso');
                console.log(data);
                
                localStorage.setItem("usuarioId", data.usuario.id);
                // Redirigir
                window.location.href = "Principal.html";
            } catch ( err ) {
                alert( err.message );
            }
        });
    </script>

</body>
</html>
