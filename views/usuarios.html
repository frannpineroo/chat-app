<!DOCTYPE html>
<html lang="es" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>Usuarios | Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-base-200 p-6">

    <div class="max-w-2xl mx-auto">

        <h1 class="text-3xl font-bold mb-6 text-center">
            Usuarios
        </h1>

        <div id="listaUsuarios" class="space-y-3"></div>

    </div>

<script>
    async function cargarUsuarios() {
        const res = await fetch('/usuarios');
        const usuarios = await res.json();

        const contenedor = document.getElementById('listaUsuarios');

        usuarios.forEach(usuario => {
            const card = document.createElement('div');
            card.className = "card bg-base-100 shadow-md hover:shadow-lg cursor-pointer transition";

            card.innerHTML = `
                <div class="card-body flex-row items-center justify-between">
                    <div>
                        <h2 class="card-title">${usuario.nombre}</h2>
                        <p class="text-sm text-gray-500">${usuario.email}</p>
                    </div>
                    <button class="btn btn-primary btn-sm">
                        Ir al Chat
                    </button>
                </div>
            `;

            card.addEventListener('click', () => {
                window.location.href = '/chat.html';
            });

            contenedor.appendChild(card);
        });
    }

    cargarUsuarios();
</script>

</body>
</html>
